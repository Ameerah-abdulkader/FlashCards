<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashCards</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="root.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="relative shadow-(--dropped-shadow)">
      <div
        class="header-items container mx-auto px-3 flex justify-between items-center py-4"
      >
        <div class="left flex items-center gap-3 flex-1">
          <button
            class="icon shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-lg shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/menu.png" alt="menu" decoding="async" />
          </button>
          <div class="title">
            <p class="font-extrabold text-lg md:text-xl">FlashCards</p>
            <p class="capitalize text-(--dark-gray-font) font-semibold text-sm">
              study smarter
            </p>
          </div>
        </div>
        <div class="mid relative flex-2">
          <img
            src="imgs/search.png"
            alt="search"
            aria-hidden="true"
            class="absolute left-3 top-1/2 size-4 -translate-y-1/2 lg:block md:block hidden"
          />
          <input
            type="text"
            placeholder="search categories, words..."
            class="bg-(--search) w-full rounded-xl py-2 pl-9 pr-3 md:block hidden outline-0 shadow-(--dropped-shadow)"
          />
        </div>
        <div class="right flex justify-end gap-3 flex-1">
          <button
            class="icon shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-lg shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/settings.png" alt="setting" decoding="async" />
          </button>
          <button
            class="icon shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-lg shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/user.png" alt="user" decoding="async" />
          </button>
        </div>
      </div>
    </header>
    <section class="bg-(--icon-strokes) flex-1 flex">
      <div
        class="sec-items1 container mx-auto flex flex-col items-center py-5 relative"
      >
        <div
          class="popup absolute top-[12%] left-1/2 -translate-x-1/2 box-border w-[calc(100%-2rem)] max-w-2xl p-5 sm:p-10 bg-[#f5f0df] rounded-xl shadow-(--dropped-shadow) hidden flex-col sm:flex-row gap-6 sm:gap-12 z-20 scale-100"
        >
          <div class="popleft flex flex-col gap-3">
            <div class="leftup flex gap-3">
              <button
                class="color rounded-full bg-(--sky-dark) w-8 h-8 cursor-pointer transition-transform duration-200 hover:scale-107"
                data-color="sky"
              ></button>
              <button
                class="color rounded-full bg-(--coral-dark) w-8 h-8 cursor-pointer transition-transform duration-200 hover:scale-107"
                data-color="coral"
              ></button>
              <button
                class="color rounded-full bg-(--lemon-dark) w-8 h-8 cursor-pointer transition-transform duration-200 hover:scale-107"
                data-color="lemon"
              ></button>
              <button
                class="color rounded-full bg-(--sage-dark) w-8 h-8 cursor-pointer transition-transform duration-200 hover:scale-107"
                data-color="sage"
              ></button>
              <button
                class="color rounded-full bg-(--sand-dark) w-8 h-8 cursor-pointer transition-transform duration-200 hover:scale-107"
                data-color="sand"
              ></button>
              <button
                class="color rounded-full bg-(--mauve-dark) w-8 h-8 cursor-pointer transition-transform duration-200 hover:scale-107"
                data-color="mauve"
              ></button>
            </div>
            <div class="leftdown flex items-center">
              <img
                src="imgs/defult-color.png"
                alt="defult-color"
                class="w-11/12 h-11/12 defult"
              />
            </div>
          </div>
          <div class="popright flex flex-col justify-center gap-7">
            <div class="rightup">
              <label for="file-name" class="block capitalize mb-1 font-medium"
                >The file's name</label
              >
              <input
                title="The File's Name"
                type="text"
                placeholder="Enter a name"
                autocomplete="off"
                class="file-name w-full rounded-lg bg-white px-3 py-2 shadow-(--dropped-shadow) outline-0"
              />
            </div>
            <div class="rightdown">
              <div class="flex gap-3">
                <button
                  type="button"
                  class="confirm bg-(--imp-green) hover:bg-(--imp-green-hover) px-4 py-2 rounded-lg shadow-(--dropped-shadow) cursor-pointer text-white capitalize"
                >
                  confirm
                </button>
                <button
                  type="button"
                  class="cancel bg-white hover:bg-(--search) px-4 py-2 rounded-lg shadow-(--dropped-shadow) cursor-pointer capitalize"
                >
                  cancel
                </button>
              </div>
            </div>
          </div>
        </div>
        <h1 class="uppercase font-extrabold text-lg md:text-2xl pl-4 w-full">
          categories
        </h1>
        <button
          class="icon-add z-10 absolute bottom-3 right-3 shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-full shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
        >
          <img src="imgs/add.png" alt="add" decoding="async" />
        </button>
        <div class="btns absolute top-1/2 flex justify-between w-full">
          <button
            class="icon-left ml-2 shrink-0 bg-gray-300 p-1 md:p-2 lg:p-2.5 rounded-full shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/left.png" alt="left" decoding="async" />
          </button>
          <button
            class="icon-right mr-2 shrink-0 bg-gray-300 p-1 md:p-2 lg:p-2.5 rounded-full shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/right.png" alt="right" decoding="async" />
          </button>
        </div>
        <div
          class="the-grid w-full grid grid-cols-1 grid-rows-3 md:grid-cols-3 md:grid-rows-2 justify-items-center px-5 pt-3 gap-y-5"
        ></div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
