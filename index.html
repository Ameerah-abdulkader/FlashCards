<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashCards</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="root.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="">
    <header class="relative shadow-(--dropped-shadow)">
      <div
        class="header-items container mx-auto px-3 flex justify-between items-center py-4"
      >
        <div class="left flex items-center gap-3 flex-1">
          <button
            class="icon shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-lg shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/menu.png" alt="menu" decoding="async" />
          </button>
          <div class="title">
            <p class="font-extrabold text-lg md:text-xl">FlashCards</p>
            <p class="capitalize text-(--dark-gray-font) font-semibold text-sm">
              study smarter
            </p>
          </div>
        </div>
        <div class="mid relative flex-2">
          <img
            src="imgs/search.png"
            alt="search"
            aria-hidden="true"
            class="absolute left-3 top-1/2 size-4 -translate-y-1/2 lg:block md:block hidden"
          />
          <input
            type="text"
            placeholder="search categories, words..."
            class="bg-(--search) w-full rounded-xl py-2 pl-9 pr-3 md:block hidden outline-0 shadow-(--dropped-shadow)"
          />
        </div>
        <div class="right flex justify-end gap-3 flex-1">
          <button
            class="icon shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-lg shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/settings.png" alt="setting" decoding="async" />
          </button>
          <button
            class="icon shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-lg shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/user.png" alt="user" decoding="async" />
          </button>
        </div>
      </div>
    </header>
    <section class="bg-(--icon-strokes) flex">
      <div
        class="sec-items1 container mx-auto flex flex-col items-center py-5 relative"
      >
        <h1 class="uppercase font-extrabold text-lg md:text-2xl pl-4 w-full">
          categories
        </h1>
        <button
          class="icon-add absolute bottom-3 right-3 shrink-0 bg-(--imp-green) hover:bg-(--imp-green-hover) p-1 md:p-2 lg:p-2.5 rounded-full shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
        >
          <img src="imgs/add.png" alt="add" decoding="async" />
        </button>
        <div class="btns absolute top-1/2 flex justify-between w-full">
          <button
            class="icon-left ml-2 shrink-0 bg-white hover:bg-(--hover-lr) p-1 md:p-2 lg:p-2.5 rounded-full shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/left.png" alt="left" decoding="async" />
          </button>
          <button
            class="icon-right mr-2 shrink-0 bg-white hover:bg-(--hover-lr) p-1 md:p-2 lg:p-2.5 rounded-full shadow-(--dropped-shadow) stroke-(--icon-strokes) cursor-pointer"
          >
            <img src="imgs/right.png" alt="right" decoding="async" />
          </button>
        </div>
        <div
          class="the-grid w-11/12 grid grid-cols-1 md:grid-cols-3 md:grid-rows-2 justify-center mt-5 mb-5 px-5"
        >
          <div
            class="one cursor-pointer flex justify-center items-center transition-transform duration-200 hover:scale-105"
          >
            <img
              src="imgs/file-orange.png"
              alt="file"
              class="w-11/12 h-11/12"
            />
          </div>
          <div
            class="one cursor-pointer flex justify-center items-center transition-transform duration-200 hover:scale-105"
          >
            <img
              src="imgs/file-yellow.png"
              alt="file"
              class="w-11/12 h-11/12"
            />
          </div>
          <div
            class="one cursor-pointer flex justify-center items-center transition-transform duration-200 hover:scale-105"
          >
            <img src="imgs/file-sand.png" alt="file" class="w-11/12 h-11/12" />
          </div>
          <div
            class="one cursor-pointer hidden md:flex justify-center items-center transition-transform duration-200 hover:scale-105"
          >
            <img src="imgs/file-sky.png" alt="file" class="w-11/12 h-11/12" />
          </div>
          <div
            class="one md:flex justify-center items-center cursor-pointer hidden transition-transform duration-200 hover:scale-105"
          >
            <img src="imgs/file-green.png" alt="file" class="w-11/12 h-11/12" />
          </div>
          <div
            class="one justify-center items-center cursor-pointer hidden transition-transform duration-200 hover:scale-105"
          >
            <img src="imgs/file-pink.png" alt="file" class="w-11/12 h-11/12" />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
